<style id="trip-css">
/* Layout: a timetable journal. Sticky tab rail over a cool washi ground; every day carries its own line colour, like a route strip on a station map. */
:root{
  --paper:#eef1ed; --card:#fbfcfa; --sunk:#e2e8e3; --ink:#18211d; --ink2:#4a5751; --ink3:#6b7871; --line:#d2dad4;

  --ok:#2a7549; --ok-soft:#dcefe3; --warn:#8f600c; --warn-soft:#f5e9cc; --bad:#a93a32; --bad-soft:#f5dcd8; --info-soft:#e3e9f3; --info:#2f4f7f;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 6px 18px rgba(20,30,25,.05);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#7cc39b; --accent-ink:#0b1a12; --accent-soft:#1d3328;
  --d1:#e58aa0; --d2:#6fc497; --d3:#74abe8; --d4:#e6936a; --d5:#dcb552;
  --ok:#6fc497; --ok-soft:#1a3125; --warn:#e2b45c; --warn-soft:#362c16; --bad:#ee8c82; --bad-soft:#3a1f1c; --info-soft:#1d2738; --info:#9dbbe6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{

  --d1:#e58aa0; --d2:#6fc497; --d3:#74abe8; --d4:#e6936a; --d5:#dcb552;
  --ok:#6fc497; --ok-soft:#1a3125; --warn:#e2b45c; --warn-soft:#362c16; --bad:#ee8c82; --bad-soft:#3a1f1c; --info-soft:#1d2738; --info:#9dbbe6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.boot{padding:24px;color:var(--ink2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:13px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:24px;font-weight:900}
h3{font-size:18px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}

/* masthead */
.mast{padding-block:28px 20px}
.mast-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:end}
.mast h1{font-weight:900;font-size:clamp(32px,5.4vw,52px);letter-spacing:.02em;margin-top:6px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:12px;font-weight:500}
.route .stn{display:inline-flex;align-items:center;gap:6px}
.route .dot{width:10px;height:10px;border-radius:50%;background:var(--dc);display:inline-block}
.route .arr{color:var(--ink3)}
.cd{text-align:right}
.cd-num{font-family:var(--f-mono);font-size:46px;line-height:1;font-weight:500}
.cd-num span{font-family:var(--f-body);font-size:16px;margin-left:4px;color:var(--ink2)}
.flights{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.ticket{display:grid;grid-template-columns:auto auto auto;align-items:center;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.ticket::before{left:-6px}.ticket::after{right:-6px}
.ticket .lbl{grid-column:1/-1;font-size:12px;color:var(--ink3)}
.ticket .t{font-family:var(--f-mono);font-size:18px;font-weight:500}
.ticket .ap{font-size:12px;color:var(--ink2);display:block;font-family:var(--f-body)}
.ticket .line{width:38px;height:1px;background:var(--ink3);position:relative}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-block:1px solid var(--line)}
.tabs-inner{display:flex;align-items:center;gap:8px;padding-block:8px}
.tablist{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tablist::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;font:inherit;font-weight:500;color:var(--ink2);padding:6px 12px;border-radius:999px;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.who-chip{flex:none;font-size:13px;color:var(--ink2);white-space:nowrap}
.who-chip b{color:var(--ink)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{padding-block:24px 120px;display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.5;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--card);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.wish{background:var(--d1);color:var(--card);border-color:transparent}
.pill.train{background:var(--d2);color:var(--card);border-color:transparent}
.pill.onsen{background:var(--d3);color:var(--card);border-color:transparent}
.pill.day{background:var(--dc);color:var(--card);border-color:transparent;font-family:var(--f-mono)}
.pill.mode{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--dc,var(--ink));border-color:var(--dc,var(--ink));color:var(--card)}

/* overview */
.daystrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.dcard{border:1px solid var(--line);border-top:5px solid var(--dc);border-radius:10px;padding:12px;background:var(--card);cursor:pointer;text-align:left;color:var(--ink);display:grid;gap:4px;align-content:start}
.dcard:hover{border-color:var(--dc)}
.dcard .dn{font-family:var(--f-mono);font-size:12px;color:var(--dc);font-weight:500}
.dcard .dt{font-weight:700;font-size:15px;line-height:1.4}
.dcard .dnight{font-size:12px;color:var(--ink3)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border-left:3px solid var(--line);padding:2px 0 2px 12px}
.stat .v{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.2}
.stat .k{font-size:13px;color:var(--ink2)}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}

/* timeline */
.dayhead{border-top:6px solid var(--dc);display:grid;gap:6px}
.dayhead .meta{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--ink2);font-size:14px}
.tl{list-style:none;margin:0;padding:0}
.tl-item{display:grid;grid-template-columns:64px 20px minmax(0,1fr);gap:0 10px}
.tl-time{font-family:var(--f-mono);font-size:14px;font-weight:500;padding-top:14px;text-align:right;color:var(--ink)}
.tl-rail{position:relative}
.tl-rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--dc);opacity:.35}
.tl-item:first-child .tl-rail::before{top:20px}
.tl-item:last-child .tl-rail::before{bottom:calc(100% - 22px)}
.tl-rail::after{content:"";position:absolute;left:50%;top:18px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--card);border:3px solid var(--dc)}
.tl-body{padding:10px 0 14px;border-bottom:1px solid var(--line);min-width:0}
.tl-item:last-child .tl-body{border-bottom:0}
.tl-title{font-weight:700;font-size:16px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.tl-desc{color:var(--ink2);margin-top:4px;font-size:14px}
.tl-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.knee{font-size:13px;margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.note-box{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;resize:vertical}
.fam-note{border-left:3px solid var(--dc,var(--line));padding:4px 0 4px 10px;font-size:14px}
.fam-note b{font-weight:700}

/* votes */
.vote{display:grid;gap:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{appearance:none;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);color:var(--ink);cursor:pointer;display:grid;gap:6px;align-content:start;position:relative}
.opt:hover{border-color:var(--ink3)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt .ot{font-weight:700}
.opt .od{font-size:13px;color:var(--ink2);white-space:pre-line}
.opt .mine{font-size:12px;color:var(--accent);font-weight:700}
.opt.decided{background:var(--accent-soft)}
.voters{display:flex;flex-wrap:wrap;gap:4px}
.voter{font-size:12px;padding:0 7px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.stamp{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:4px;padding:0 6px;transform:rotate(-2deg)}
.who-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.preview{width:100%;min-height:180px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--sunk);color:var(--ink);resize:vertical}

/* hotels */
.hcands{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.hc{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start;background:var(--card)}
.hc.chosen{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.hc .hn{font-weight:700;font-size:16px;line-height:1.4}
.hc .he{font-size:12px;color:var(--ink3)}
.hc .price{font-family:var(--f-mono);font-size:20px;font-weight:500}
.hc .price small{font-family:var(--f-body);font-size:12px;color:var(--ink2);font-weight:400}
.hc ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink2)}

/* tasks */
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0}
.task .tt{font-weight:700}
.task .tn{font-size:13px;color:var(--ink2)}
.task .side{display:grid;gap:6px;justify-items:end;text-align:right}
.task.done .tt{text-decoration:line-through;color:var(--ink3)}
select,input[type=text]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--card);color:var(--ink)}
input[type=text]{width:100%}

/* map */
.mapbox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.mapbox svg{display:block;width:100%;height:auto}
.loopmap{min-width:640px}
.pinmap{min-width:300px}
.sea{font-family:var(--f-display);font-size:13px;fill:var(--ink3);letter-spacing:.3em}
.st{font-size:13px;font-weight:700;fill:var(--ink)}
.stsub{font-size:11px;fill:var(--ink2)}
.seg{font-size:11px;font-weight:700}
.mapbg{fill:var(--sunk)}
.grid{stroke:var(--line);stroke-width:1px}
.node{fill:var(--card);stroke:var(--ink);stroke-width:2.5px}
.node-in{fill:var(--ink)}
.pin{stroke:var(--card);stroke-width:2px}
.pinnum{font-family:var(--f-mono);font-size:12px;font-weight:700;fill:var(--card)}
.bar{stroke:var(--ink);stroke-width:2px}
.maptxt{font-size:11px;fill:var(--ink2)}
.north{fill:var(--ink2)}
.routesw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:22px;height:5px;border-radius:3px;background:var(--dc);vertical-align:middle;margin-right:6px}
.maplist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.maplist li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.maplist .num{width:22px;height:22px;border-radius:50%;background:var(--dc);color:var(--card);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center}

/* info */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-weight:700;color:var(--ink2);font-size:13px}
table.t td.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.tablebox{overflow-x:auto}
table.t tr.tot td{font-weight:700;color:var(--ink)}
table.t tr.grand td{border-top:2px solid var(--ink3)}
.prose{max-width:68ch}
.prose ul{padding-left:18px;margin:6px 0}
.prose li{margin:3px 0}

/* save bar + toast */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .wrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.savebar .btn{border-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.editbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);font-weight:700}

@media (max-width:860px){
  .daystrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .mast-grid{grid-template-columns:minmax(0,1fr)}
  .cd{text-align:left}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .tl-item{grid-template-columns:48px 16px minmax(0,1fr);gap:0 8px}
  .tl-time{font-size:13px}
  .task{grid-template-columns:minmax(0,1fr)}
  .task .side{justify-items:start;text-align:left}
  .who-chip{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function pinMap(area,color){
  var pts=area.pts.map(function(k){return PLACES[k];});
  var W=420,H=280,P=36;
  var lat0=pts.reduce(function(a,p){return a+p.lat;},0)/pts.length, k=Math.cos(lat0*Math.PI/180);
  var xs=pts.map(function(p){return p.lon*k;}), ys=pts.map(function(p){return -p.lat;});
  var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),miny=Math.min.apply(null,ys),maxy=Math.max.apply(null,ys);
  var sx=Math.max(maxx-minx,0.006), sy=Math.max(maxy-miny,0.006);
  var sc=Math.min((W-2*P)/sx,(H-2*P)/sy), cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  var placed=[];
  var XY=pts.map(function(p,i){
    var x=(xs[i]-cx)*sc+W/2, y=(ys[i]-cy)*sc+H/2, tries=0;
    while(tries<6&&placed.some(function(q){return Math.hypot(q[0]-x,q[1]-y)<24;})){x+=17;y-=13;tries++;}
    placed.push([x,y]);return [x,y];
  });
  var kmPerPx=111.32/sc, nice=[0.2,0.5,1,2,5,10,20,50], len=nice[0];
  for(var i=0;i<nice.length;i++){if(nice[i]/kmPerPx<=120)len=nice[i];}
  var barPx=len/kmPerPx;
  var s='<svg class="pinmap" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(area.name)+' 地圖">';
  s+='<rect width="'+W+'" height="'+H+'" class="mapbg"/>';
  for(var gx=0;gx<=W;gx+=42)s+='<line x1="'+gx+'" y1="0" x2="'+gx+'" y2="'+H+'" class="grid"/>';
  for(var gy=0;gy<=H;gy+=42)s+='<line x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" class="grid"/>';
  s+='<polyline points="'+XY.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'" style="fill:none;stroke:'+color+';stroke-width:2.5px;stroke-dasharray:5 6;stroke-linecap:round"/>';
  XY.forEach(function(p,i){s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="11" class="pin" style="fill:'+color+'"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="middle" class="pinnum">'+(i+1)+'</text>';});
  s+='<g transform="translate(16,'+(H-16)+')"><line x1="0" y1="0" x2="'+barPx.toFixed(1)+'" y2="0" class="bar"/><line x1="0" y1="-4" x2="0" y2="4" class="bar"/><line x1="'+barPx.toFixed(1)+'" y1="-4" x2="'+barPx.toFixed(1)+'" y2="4" class="bar"/><text x="'+(barPx/2).toFixed(1)+'" y="-7" text-anchor="middle" class="maptxt">'+len+' 公里</text></g>';
  s+='<g transform="translate('+(W-22)+',24)"><path d="M0 -12 L6 6 L0 2 L-6 6 Z" class="north"/><text x="0" y="20" text-anchor="middle" class="maptxt">N</text></g>';
  s+='</svg>';
  return s;
}

function b64enc(str){var bytes=new TextEncoder().encode(str),bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin);}
function b64dec(s){var bin=atob(s),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}
function validKeys(src){

}

function importCode(text){

function toast(m){toastMsg=m;render();clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastMsg='';render();},3200);}

app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  var act=el.getAttribute('data-act'), v=el.getAttribute('data-v');
  if(act==='tab'){tab=v;if(location.hash!=='#'+v)location.hash=v;render();window.scrollTo(0,0);return;}
  if(act==='goday'){dayN=+v||1;store.set('dayn',dayN);tab='days';location.hash='days';render();window.scrollTo(0,0);return;}
  if(act==='day'){dayN=+v||1;store.set('dayn',dayN);render();return;}
  if(act==='mapday'){mapN=+v||1;store.set('mapn',mapN);render();return;}
  if(act==='route'){if(v==='a'||v==='b'){routeView=v;store.set('routeview',v);}render();return;}
  if(act==='who'){me=v;store.set('me',v);render();return;}
  if(act==='pick'){var key=el.getAttribute('data-vote');if(picks[key]===v)delete picks[key];else picks[key]=v;store.set('picks',picks);render();return;}
  if(act==='claim'){var i=claims.indexOf(v);if(i>=0)claims.splice(i,1);else claims.push(v);store.set('claims',claims);render();return;}
  if(act==='copy'){doCopy();return;}
  if(act==='edit'){if(editMode){if(!isDirty()){editMode=false;draft=null;}}else{editMode=true;draft=clone(shared);}render();return;}
  if(!editMode||!draft)return;
  if(act==='decide'){var vid=el.getAttribute('data-vote');if(draft.decisions[vid]===v)delete draft.decisions[vid];else draft.decisions[vid]=v;render();return;}
  if(act==='hchoose'){var nid=el.getAttribute('data-night');if(draft.hotelPick[nid]===v)delete draft.hotelPick[nid];else draft.hotelPick[nid]=v;render();return;}
  if(act==='hbooked'){var nb=el.getAttribute('data-night');if(draft.hotelBooked[nb])delete draft.hotelBooked[nb];else draft.hotelBooked[nb]=true;render();return;}
  if(act==='import'){var box=document.getElementById('import-box');importMsg=importCode(box?box.value:'');render();return;}
  if(act==='syncme'){if(me){draft.family[me]={k:validKeys(picks),c:claims.slice(),n:cleanNotes(notes),t:todayStr()};importMsg='已加入 '+PNAME[me]+' 嘅選擇。';}render();return;}
  if(act==='discard'){editMode=false;draft=null;importMsg='';render();return;}
  if(act==='save'){saveShared();return;}
});
app.addEventListener('input',function(e){
  var el=e.target;
  if(el.hasAttribute('data-note')){var k=el.getAttribute('data-note');notes[k]=el.value;store.set('notes',notes);var pv=document.getElementById('summary-preview');if(pv)pv.value=buildSummary();return;}
  if(el.getAttribute('data-tfield')==='note'&&editMode&&draft){var t=el.getAttribute('data-task');draft.tasks[t]=draft.tasks[t]||{owner:'',status:'todo',note:''};draft.tasks[t].note=el.value.slice(0,300);}
});
app.addEventListener('change',function(e){
  var el=e.target, f=el.getAttribute('data-tfield');
  if(!f||!editMode||!draft)return;
  var t=el.getAttribute('data-task');draft.tasks[t]=draft.tasks[t]||{owner:'',status:'todo',note:''};
  if(f==='owner'){draft.tasks[t].owner=PNAME[el.value]?el.value:'';}
  else if(f==='status'){if(STATUS.some(function(x){return x[0]===el.value;}))draft.tasks[t].status=el.value;}
  else if(f==='note'){draft.tasks[t].note=el.value.slice(0,300);}
  render();
});

async function doCopy(){
  var text=buildSummary();
  try{await navigator.clipboard.writeText(text);toast('已複製。貼去 WhatsApp 傳俾 Clinton。');}
  catch(err){var pv=document.getElementById('summary-preview');if(pv){pv.focus();pv.select();}toast('複製唔到，已經幫你選好文字，請手動複製。');}
}

function buildDocument(state){
  var css=document.getElementById('trip-css').textContent;
  var json=JSON.stringify(state).replace(/</g,String.fromCharCode(92)+'u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+SKEL_RESET+'</style></head><body>\n'+
    PAGE_HEAD+'\n<style id="trip-css">'+css+'</style>\n<div id="app">'+APP_FALLBACK+'</div>\n<script type="application/json" id="trip-state">'+json+SCRIPT_END+'\n<script id="trip-app">('+main.toString()+')();'+SCRIPT_END+'\n\n</body></html>';
}
async function saveShared(){
  if(!artifactNs||!draft)return;
  draft.updated=todayStr();
  var html=buildDocument(draft);
  try{sessionStorage.setItem('kq27:flash','saved');}catch(e){}
  try{await artifactNs.publish(html);}
  catch(err){
    try{sessionStorage.removeItem('kq27:flash');}catch(e){}
    var c=err&&err.code;
    if(c==='conflict'){toast('啱啱有新版本，頁面會重新載入。');return;}
    if(c==='rate_limited'){toast('儲存得太密，等一陣再試。');return;}
    if(['not_writer','not_granted','not_declared','capability_disabled','capability_removed','consent_required'].indexOf(c)>=0){canWrite=false;editMode=false;draft=null;toast('呢個檢視只可以睇，唔可以儲存。');return;}
    toast('儲存唔到（'+(c||'錯誤')+'），請再試一次。');
  }
}
(async function initCaps(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    var res=await Promise.all([window.claude.use('user'),window.claude.use('artifact')]);
    var u=res[0],a=res[1];
    if(!a||!u)return;
    var ok=await u.canEdit();
    if(ok){artifactNs=a;canWrite=true;render();}
  }catch(e){}
})();

render();
try{if(sessionStorage.getItem('kq27:flash')==='saved'){sessionStorage.removeItem('kq27:flash');toast('已儲存共享版本。');}}catch(e){}
})();</script>
